<html lang="en">
    <head>
        <meta charset="UTF-8">

        <link rel="stylesheet"  href="style.css">
    </head>
    <body>
        <header>
            <nav>
                <div class="logo">TechPulse</div>
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="about.html" >About</a></li>
                    <li><a href="Services.html" >Services</a></li>
                    <li><a href="contact.html" >Contact</a></li>
                </ul>
                <div class="hamburger" id="hamburger">&#9776;</div>
            </nav>
        </header>
        <div class="container">
            <h2>Contact Our Team</h2>
            <p style="margin-bottom: 2rem;"> Get in touch with us for inquires, partnerships,or support.</p>
            <div class="contact-wrapper">
                <div class="Contact-info">
                    <h3>Headquarters</h3>
                    <P> 123 Innovations Drive,Tech City </P>
                    <p style="margin: 1rem 0;"><strong>Email:</strong> support@techpulse-sample.com</p>
                    <P><strong>Telephone:</strong> 07032932608</P>
                </div>
                <div class="contact-form-container">
                    <div id="successBanner" class="success-banner"></div>
                    <form id="contactForm" novalidate>
                        <div class="form-group">
                            <label for="fullName"> Full Name </label>
                            <input type="text" id="fullName" placeholder="Enter your full name">
                            <div class="error-message" id="fullNameError"></div>
                        </div>
                        <div class="form-group">
                            <label for="Message">Message</label>
                            <textarea id="Message" name="Message" placeholder="Enter your Message"></textarea>
                            <div class="error-message"id="messageError"></div>
                        </div>


                    </form>   
                </div>
            </div>
        </div>
